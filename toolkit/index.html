<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Spacedrift Toolkit</title>
<style>
:root{--navy:#1B3A5C;--navy2:#142E4A;--teal:#0E9E8A;--cream:#F7F5F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
.bar{flex:0 0 auto;height:52px;background:var(--navy2);border-bottom:2px solid var(--teal);display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff}
.bar img{height:28px;width:auto;flex:0 0 auto}
.brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:6px;height:100%}
.tabs button{border:0;background:none;color:rgba(255,255,255,.55);font-weight:600;font-size:13px;font-family:inherit;padding:0 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button[aria-selected=true]{color:var(--teal);border-bottom-color:var(--teal)}
.sp{flex:1}
.hb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:7px;padding:6px 10px;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.2)}
.frames{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream);display:none}
iframe.on{display:block}
.home{position:absolute;inset:0;overflow:auto;display:none;padding:40px 16px}
.home.on{display:block}
.hwrap{max-width:860px;margin:0 auto}
.home h1{font-size:clamp(26px,4vw,36px);font-weight:700;color:var(--navy);line-height:1.15}
.home .sub{color:#6B6560;margin:8px 0 26px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;background:#fff;border:1px solid #D0CCC4;border-top:4px solid var(--teal);border-radius:12px;padding:22px;cursor:pointer;font-family:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.tool:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,46,74,.14)}
.tool .ic{font-size:28px;line-height:1}
.tool h2{font-size:19px;color:var(--navy)}
.tool p{font-size:14px;color:#6B6560;line-height:1.5;flex:1}
.tool .go{margin-top:6px;background:var(--teal);color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}
.hnote{margin-top:22px;font-size:13px;color:#6B6560}
#logo{display:flex;flex:0 0 auto}
@media(prefers-reduced-motion:reduce){.tool{transition:none}.tool:hover{transform:none}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media(max-width:640px){.brand{display:none}.hb span{display:none}}
</style></head><body>

const KEYS=['spacedrift_wsr_template_v1','spacedrift_wsr_template_photos_v1','spacedrift_income_expenses_v1'];
const $=id=>document.getElementById(id);
const dec=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u);};
function load(id,force){const f=$('f-'+id);if(force||!f.dataset.ready){f.srcdoc=dec(SRC[id]);f.dataset.ready='1';}}
function show(id,push){
  if(id!=='home')load(id);
  $('home').classList.toggle('on',id==='home');
  ['report','expenses'].forEach(k=>$('f-'+k).classList.toggle('on',k===id));
  $('b-home').hidden=(id==='home');
  if(push){try{history.pushState(null,'','#'+id);}catch(e){}}
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
$('b-home').onclick=()=>show('home',1);
$('logo').onclick=e=>{e.preventDefault();show('home',1);};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go,1));
const fromHash=()=>{const h=location.hash.slice(1);return(h==='report'||h==='expenses')?h:'home';};
window.onpopstate=()=>show(fromHash());
$('b-backup').onclick=()=>{
  try{
    const data={};KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data[k]=v;});
    if(!Object.keys(data).length){toast('Nothing to back up yet');return;}
    const blob=new Blob([JSON.stringify({app:'spacedrift-toolkit',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='Spacedrift_Toolkit_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
    toast('Backup saved. Keep this file safe');
  }catch(e){alert('Could not create the backup file.');}
};
$('b-restore').onclick=()=>$('rf').click();
$('rf').onchange=function(){
  const f=this.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d||d.app!=='spacedrift-toolkit'||typeof d.data!=='object')throw new Error('bad');
      if(!confirm('Restore this backup? It will replace the site report and the ledger currently saved on this device.'))return;
      KEYS.forEach(k=>{localStorage.removeItem(k);if(typeof d.data[k]==='string')localStorage.setItem(k,d.data[k]);});
      ['report','expenses'].forEach(k=>{if($('f-'+k).dataset.ready)load(k,true);});
      toast('Backup restored');
    }catch(err){alert('Could not read that file. Choose a backup made with Backup all in this toolkit.');}
  };
  rd.readAsText(f);this.value='';
};
show(fromHash());
</script></body></html>
