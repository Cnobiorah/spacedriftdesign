<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave a review | Spacedrift Design Studio</title><meta name="description" content="Share your experience of working with Spacedrift Design Studio."><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap"><link rel="stylesheet" href="styles.css"></head><body><header id="nav"></header><div class="hero sm"><div class="wrap"><span class="eyebrow">Your feedback</span><h1>Share your experience</h1><p>Worked with Spacedrift? Tell us how it went. We read every review.</p></div></div>
<section><div class="wrap"><form id="rf" data-to="info@spacedriftdesign.com"><input type="hidden" name="_subject" value="New review for the Spacedrift website"><p hidden><label>Leave this empty: <input name="_gotcha" tabindex="-1" autocomplete="off"></label></p>
<div class="row2"><label>Your name<input name="name" required></label><label>Your email (not published)<input type="email" name="email" required></label></div>
<div class="row2"><label>Project or location<input name="project" placeholder="For example: living room design, Port Harcourt"></label><label>Rating<select name="rating"><option>5 - Excellent</option><option>4 - Very good</option><option>3 - Good</option><option>2 - Fair</option><option>1 - Poor</option></select></label></div>
<label>Your review<textarea name="review" rows="6" required></textarea></label>
<label class="ck"><input type="checkbox" name="permission" value="yes" required> I agree that Spacedrift may publish my review and name on this website.</label>
<button class="btn fill" type="submit">Submit review</button></form></div></section><footer id="foot"></footer><script src="data.js"></script><script src="app.js"></script></body></html>
